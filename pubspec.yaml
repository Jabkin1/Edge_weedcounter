name: yweed_counter_plus
description: "An open source edge computing app."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+1
  tflite_flutter: ^0.12.1
  image: ^4.5.4 
  permission_handler: ^12.0.0+1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  path_provider: ^2.1.1
  csv: ^8.0.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.3.5

flutter:
  generate: true      
  uses-material-design: true

  assets:
    - assets/models/yolo.tflite
    - assets/models/model2.tflite
    - assets/logo.png
    - assets/labels.txt
    - assets/plants.csv
    - assets/pulverise.png


flutter_native_splash:
  color: "#D7DAE0"
  image: assets/logo.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: scaleAspectFit
